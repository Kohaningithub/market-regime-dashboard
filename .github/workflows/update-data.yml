name: Update market data

on:
  workflow_dispatch:
    inputs:
      refresh_history:
        description: Rebuild the full five-year calibration
        required: false
        default: false
        type: boolean
  schedule:
    # Redundant off-peak attempts make GitHub schedule delays harmless.
    # The guard exits quickly after the first successful morning/close refresh.
    # Morning primary run: 09:40 ET. Retry at 09:55, 10:10, and 10:25.
    # Both UTC variants cover daylight-saving and standard time; the guard
    # skips attempts that arrive before the ET window or after it is fresh.
    - cron: "40 13 * * 1-5"
    - cron: "55 13 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "55 14 * * 1-5"
    - cron: "10 15 * * 1-5"
    - cron: "25 15 * * 1-5"
    # Close primary run: 16:40 ET. Retry at 16:55, 17:10, and 17:25.
    - cron: "40 20 * * 1-5"
    - cron: "55 20 * * 1-5"
    - cron: "10 21 * * 1-5"
    - cron: "25 21 * * 1-5"
    - cron: "40 21 * * 1-5"
    - cron: "55 21 * * 1-5"
    - cron: "10 22 * * 1-5"
    - cron: "25 22 * * 1-5"
    # Historical calibration is expensive and only needs a weekly refresh.
    - cron: "17 10 * * 0"

permissions:
  contents: write

concurrency:
  group: dashboard-publish-main
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dashboard.txt

      - name: Decide whether this retry is needed
        id: decision
        shell: bash
        run: |
          args=(--schedule "${{ github.event.schedule }}" --github-output "$GITHUB_OUTPUT")
          if [[ "${{ inputs.refresh_history }}" == "true" ]]; then
            args+=(--force-history)
          fi
          python scripts/market_update_guard.py "${args[@]}"

      - name: Install analysis dependencies
        if: steps.decision.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dashboard.txt

      - name: Generate current market snapshot
        if: steps.decision.outputs.should_run == 'true'
        run: |
          python scripts/update_data.py
          python scripts/build_allocation_signal.py
          python scripts/build_daily_evidence.py

      - name: Refresh five-year calibration
        if: steps.decision.outputs.should_run == 'true' && steps.decision.outputs.refresh_history == 'true'
        run: |
          if [[ "${{ steps.decision.outputs.full_history }}" == "true" ]]; then
            python scripts/backfill_regime_history.py --years 5
          else
            python scripts/backfill_regime_history.py --years 5 --incremental
          fi
          python scripts/analyze_regime_history.py
          python scripts/build_allocation_signal.py
          python scripts/build_daily_evidence.py

      - name: Build data asset manifest
        if: steps.decision.outputs.should_run == 'true'
        run: python scripts/build_data_manifest.py

      - name: Commit updated data
        if: steps.decision.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- data/latest.json data/history.json data/regime_model_history_5y.csv data/regime_model_history_5y.json data/regime_model_analysis_summary.json data/regime_model_quant_analysis.json data/allocation_signal.json data/allocation_signal_history.csv data/daily_evidence.json data/asset_manifest.json; then
            echo "No market data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/regime_model_history_5y.csv data/regime_model_history_5y.json data/regime_model_analysis_summary.json data/regime_model_quant_analysis.json data/allocation_signal.json data/allocation_signal_history.csv data/daily_evidence.json data/asset_manifest.json
          git commit -m "Update market data snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
