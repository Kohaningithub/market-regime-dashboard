name: Update news archive index

on:
  workflow_dispatch:
  push:
    paths:
      - "data/news/*.md"
      - "data/news/**/*.md"
      - "data/news-en/*.md"
      - "data/news-en/**/*.md"
      - "scripts/build_news_index.py"
      - "scripts/validate_news_archive.py"

permissions:
  actions: write
  contents: write

concurrency:
  group: dashboard-publish-main
  cancel-in-progress: false

jobs:
  update-news-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild archive index
        run: |
          python scripts/build_news_index.py
          python scripts/validate_news_archive.py
          python scripts/build_data_manifest.py

      - name: Commit updated index
        run: |
          if git diff --quiet -- data/news_index.json data/news_index_en.json data/asset_manifest.json; then
            echo "No news index changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_index.json data/news_index_en.json data/asset_manifest.json
          git commit -m "Update news archive index"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts." >&2
          exit 1

      # Commits made with GITHUB_TOKEN do not trigger the push-based Pages
      # workflow. Request a deployment explicitly after a successful index run.
      - name: Deploy refreshed dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
