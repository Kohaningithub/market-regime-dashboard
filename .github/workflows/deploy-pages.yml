name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages is deployed by this workflow only.  Keeping the concurrency group
# separate from data/news publishing prevents a second commit from leaving an
# obsolete Pages deployment ahead of the newest commit.
concurrency:
  group: github-pages-deployment
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest dashboard
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy latest dashboard
        id: deployment
        uses: actions/deploy-pages@v4
